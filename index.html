<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D STL Measurer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="panel">
                <h2>3D Measurer</h2>

                <div class="section">
                    <label for="file-input" class="file-label">Load File</label>
                    <input type="file" id="file-input" accept=".stl,.step,.stp" />
                    <div id="file-name" class="file-name-display"></div>
                </div>

                <div class="section">
                    <h3>Mode</h3>
                    <div class="mode-buttons">
                        <button class="mode-btn" data-mode="line">
                            <span class="mode-icon">📏</span>
                            <span class="mode-label">Line</span>
                            <span class="mode-desc">2 pts</span>
                        </button>
                        <button class="mode-btn" data-mode="circle">
                            <span class="mode-icon">⬤</span>
                            <span class="mode-label">Circle</span>
                            <span class="mode-desc">3 pts</span>
                        </button>
                        <button class="mode-btn" data-mode="caliper">
                            <span class="mode-icon">⟺</span>
                            <span class="mode-label">Caliper</span>
                            <span class="mode-desc">2 pts</span>
                        </button>
                        <button class="mode-btn" data-mode="bore">
                            <span class="mode-icon">◎</span>
                            <span class="mode-label">Bore</span>
                            <span class="mode-desc">3+ pts</span>
                        </button>
                    </div>
                </div>

                <div class="section">
                    <h3>Plane Axis</h3>
                    <div class="axis-buttons">
                        <button class="axis-btn active" data-axis="normal" title="Plane follows surface normal at first click">Normal</button>
                        <button class="axis-btn" data-axis="x" title="Plane perpendicular to X axis — cut left/right">X</button>
                        <button class="axis-btn" data-axis="y" title="Plane perpendicular to Y axis — cut up/down">Y</button>
                        <button class="axis-btn" data-axis="z" title="Plane perpendicular to Z axis — cut front/back">Z</button>
                    </div>
                    <div class="axis-hint" id="axis-hint">Plane follows surface at click point</div>
                </div>

                <div class="section">
                    <h3>Measurement</h3>
                    <div class="info-box">
                        <p><strong>Points:</strong> <span id="point-count">0</span> / <span id="point-total">2</span></p>
                    </div>
                    <div id="measurement-display" class="measurement-display hidden">
                        <p><span id="result-label">Distance:</span> <span id="distance-value">0</span> mm</p>
                        <button id="clear-measurement" class="btn-secondary">Clear</button>
                    </div>
                    <div id="no-measurement" class="info-text">
                        <span id="mode-instructions">Click <strong>2 points</strong> on the mesh.</span>
                    </div>
                </div>

                <div class="section">
                    <h3>Marker Size</h3>
                    <div class="slider-row">
                        <input type="range" id="marker-size" min="0.1" max="5" step="0.1" value="1.0">
                        <span id="marker-size-value">1.0×</span>
                    </div>
                </div>

                <div class="section">
                    <h3>Controls</h3>
                    <div class="controls-info">
                        <p><strong>Rotate:</strong> Left drag</p>
                        <p><strong>Pan:</strong> Right drag</p>
                        <p><strong>Zoom:</strong> Scroll</p>
                        <p><strong>Pick point:</strong> Left click on mesh</p>
                    </div>
                </div>

                <div class="section">
                    <button id="reset-view" class="btn-secondary">Reset View</button>
                </div>
            </div>
        </div>

        <div class="canvas-container">
            <div id="canvas"></div>
            <div id="loading-message" class="loading-message hidden">
                <div style="text-align:center">
                    <div style="font-size:24px;margin-bottom:10px">⏳</div>
                    Loading file...
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.12/dist/occt-import-js.js"></script>
    <script src="app.js"></script>
</body>
</html>
